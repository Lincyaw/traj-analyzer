[project]
name = "traj-analyzer"
version = "0.1.0"
description = "Batch analysis of LLM trajectories: feature extraction, sampling, reports"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "aifn[deepseek]",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "libdash>=0.5.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shasta",
    "sqlglot>=30.19,<30.22",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
traj = "traj_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
aifn = { git = "https://github.com/Lincyaw/aifn", rev = "7938dd2f4437fa7605f583610a301f3c2427831b" }
shasta = { git = "https://github.com/binpash/shasta", rev = "3ec173d6dc96e9007f5b582634f9315eafcac867" }

[tool.uv.extra-build-dependencies]
shasta = ["setuptools"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.scratch/pytest"
