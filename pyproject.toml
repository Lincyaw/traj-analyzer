[project]
name = "traj-analyzer"
version = "0.1.0"
description = "Batch analysis of LLM trajectories: feature extraction, sampling, reports"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "aifn[deepseek]",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
traj = "traj_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
aifn = { git = "https://github.com/Lincyaw/aifn" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.scratch/pytest"
