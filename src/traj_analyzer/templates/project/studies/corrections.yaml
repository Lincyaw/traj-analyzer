# A study is one question: which trajectories succeed, and which features tell why.
# `traj study screen corrections` checks every feature on this population; `traj study pairs` needs a pairs section.
description: Which sessions went through without the user correcting the assistant.
target: "user_corrects == 0"
# Features whose influence the screen removes, such as a model or task feature; categories work best.
by: []
# Outcome features are never screened and never count as duplicates of a candidate.
outcomes: [user_corrects, user_complains, user_approves]
# pairs:
#   within: task_id        # a category feature both trajectories of a pair share
#   distinct: model        # no value of this feature appears in two pairs
#   n: 5
