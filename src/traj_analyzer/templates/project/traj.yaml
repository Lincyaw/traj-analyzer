# traj-analyzer project configuration; docs/design.md in the traj-analyzer repository describes every field.
version: 1

datasets:
  claude-code:
    adapter: claude_code
    input: [~/.claude/projects/*/*.jsonl]
    exclude: []
    options:
      include_thinking: false
      include_sidechains: false
      min_user_turns: 1

# Enabled operators; `traj operators list` shows the built-in library and the project's operators/ directory.
# LLM operators with the same `call` share one LLM call per trajectory.
operators:
  - use: stats.basic
  - use: stats.tool_usage
  - use: outcome.task_type
    call: outcome
  - use: outcome.task_completed
    call: outcome
  - use: collab.user_frustration
    call: outcome
  - use: collab.failure_modes
    call: outcome

# Optional settings per call group: model overrides engine.model, evidence asks for cited steps.
calls:
  outcome: {evidence: true}

render:
  max_step_chars: 4000
  chunk_chars: 24000

engine:
  kind: deepseek
  dsh_home: ~/.dsh
  model: deepseek-v4-flash
  provider: deepseek-official
  reasoning_effort: null
  env_passthrough: [DEEPSEEK_API_KEY]
  patches: []

extract:
  workers: 4
  timeout_s: 900
  attempts: 2

sampling:
  vector_length: 10
