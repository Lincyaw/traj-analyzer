# traj-analyzer project configuration; docs/design.md in the traj-analyzer repository describes every field.
version: 1

datasets:
  claude-code:
    adapter: claude_code
    input: [~/.claude/projects/*/*.jsonl]
    exclude: []
    options:
      include_thinking: false
      include_sidechains: false
      min_user_turns: 1
    # Written at the top of every rendered trajectory, so judgment operators know what they are reading.
    description: A Claude Code session between a developer and the coding agent.

# Parsing layers run on every trajectory besides those the enabled operators need; `traj layers list` shows them.
layers: []

# Enabled operators; `traj operators list` shows the built-in library and the project's operators/ directory.
# Judgment operators with the same `call` share one call per trajectory, or per window.
operators:
  - use: stats.basic
  - use: stats.tool_usage
  - use: stats.actions
  - use: stats.dialogue
  - use: events.generic
  - use: signals.user_reaction
    call: reactions
  - use: signals.end_state
    call: ending
  - use: task.request_kinds
    call: dialogue
  - use: user.complains
    call: dialogue
  - use: user.corrects
    call: dialogue
  - use: user.follow_up
    call: dialogue
  - use: user.approves
    call: dialogue
  - use: assistant.claims_done
    call: dialogue
  - use: assistant.asks_user
    call: dialogue

# Optional settings per call group: model overrides engine.model, evidence asks for cited steps, sample draws
# trajectories per batch, window sizes the windows of a group over windows, context is the steps shown before
# each message the user typed to a group over turns, tail the last steps shown to a group over the end.
calls:
  dialogue: {evidence: true}
  reactions: {evidence: true, context: 8}
  ending: {evidence: true, tail: 40}

# Columns whose values make a batch, as `meta.<key>` or a feature; a scalar is cut into quartiles.
batches: []
# Columns held fixed when batches are compared and trajectories scored.
strata: []
# The batch every batch is compared with, or `all` for every other batch.
baseline: all

alerts:
  min_batch: 30
  min_tail_precision: 0.6
  min_lift: 1.5
  tail_size: 12
  consequences: [reaction, interrupt]

# Labels of the trajectories, used only to check the method where a dataset has them.
labels:
  outcome: null
  correction: null

render:
  max_step_chars: 4000
  chunk_chars: 24000

engine:
  dsh_home: ~/.dsh
  model: deepseek-v4-flash
  provider: deepseek-official
  reasoning_effort: null
  env_passthrough: [DEEPSEEK_API_KEY]
  patches: []

extract:
  workers: 4
  timeout_s: 900
  attempts: 2

sampling:
  vector_length: 10

# The trajectories that count as normal behaviour: all datasets, or a list of dataset names.
reference:
  datasets: all
  exclude: []

# `traj evaluate` and `traj mine` measure judgment features a second time with `model`, which must differ from
# engine.model.
evaluation:
  size: 100
  model: null

mining:
  starting: 12
  hypotheses: 12
